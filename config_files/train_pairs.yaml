# ═══════════════════════════════════════════════════════════════════
# PAIRS — Combined config: L_ICA + Set-based Identity Encoding
# ═══════════════════════════════════════════════════════════════════
# Idea 2 (L_ICA): K-semantic weighted attention consistency loss
# Idea 3 (PIE):  Permutation-Invariant Identity Encoding
# ═══════════════════════════════════════════════════════════════════

compute:
  batch_size: 1
  workers: 12
optim:
  learning_rate: 5e-4
  scheduler_type: CONSTANT
  target_lr: 5e-4
  lambda_lpips: 5.0
  lambda_dreamsim: 0.0
  lambda_l2: 5.0
  lambda_l1: 0.0
  lambda_ssim: 1.0
  lambda_id_loss: 1.0
  lambda_gan: 0.5
  lambda_attn_reg: 0.0
  lambda_cycle: 0.0
  lambda_landmark: 0.0
  lambda_pos_reg: 0.0
  lambda_neg_reg: 0.0
  lambda_facial_comp: 0.0
  lambda_ica: 10000.0         # L_ICA: K-semantic weighted attention consistency loss
  num_lica_layers: 3           # Number of decoder layers sampled per L_ICA forward
  gan_disc_type: dinov2
  gradient_accumulation_steps: 3
  compute_id_loss_between_identities: false
  mixed_precision: true
  gradient_checkpointing: false
data:
  data_root: ./CelebRefHQHR/train
  val_data_root: ./CelebRefHQHR/val
  dataset_type: face_restore
  max_conditioning_images: 2    # L_ICA requires >= 2 refs per identity
  store_landmarks: false
model:
  net_type: pix2pix_turbo
  lora_rank_unet: 32
  lora_rank_vae: 32
  use_shared_attention: true
  train_vae: true
  train_only_vae_encoder: false
  guidance_scale: 0
  use_shortcuts: false
  use_adain: true
  train_input: true             # Shared-Attention concat mode (required for L_ICA)
  checkpoint_path: ./InstantRestore/final_model_ckpt.pt
  # ── Set-based Identity Encoding ──────────────────────────────────
  use_set_encoding: true
  set_encoding_num_inducing: 256   # M=256 inducing points for PIE
  # up_block indices: leave null to auto-hook all SD-Turbo up_blocks
  set_encoding_up_block_indices: null
log:
  exp_root: ./experiments
  exp_name: pairs_full
  log2wandb: true
  val_vis_count: 50
  vis_attention: false
  debug_l_ica: false              # Set true to enable L_ICA debug prints
steps:
  max_steps: 5002
  image_interval: 250
  metric_interval: 10
  val_interval: 250
  save_interval: 2500
